# Build with VITE_APP_BASE=/app/ and place dist contents in /usr/share/nginx/html/app/.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    location /api/ { proxy_pass http://127.0.0.1:8080; }
    location = /app { return 301 /app/; }
    location /app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /app/index.html { add_header Cache-Control "no-cache"; }
    location /app/mock/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location /app/ { try_files $uri $uri/ /app/index.html; }
}
