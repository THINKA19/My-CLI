# ==============================================================================
# 📄 GitHub Actions CI 工作流文件：全平台部署适配与 Docker 容器访问测试
# ------------------------------------------------------------------------------
# 💡 【新手学习指南 / 本文件作用与使用说明】
# 1. 这个文件是做什么的？
#    这是一个纯本地/模拟演练的 CI 测试工作流文件。它的作用是验证项目在各个云平台
#    （OSS、COS、GitHub Pages、Vercel、Cloudflare Pages）以及不同路径（根路径 / 子路径）
#    下的静态打包与 Docker 镜像构建兼容性，**完全不连接真实云账号，也不会发布任何内容**。
#
# 2. 它是怎么运行和使用的？
#    - 自动触发：推送到 main 分支或提交 Pull Request 时自动触发测试。
#    - 手动触发：可在 GitHub 仓库的「Actions」界面找到此工作流，点击按钮手动触发。
#    - 模拟验证：包含两个 Job，分别通过矩阵测试各种路径下的静态打包，以及利用 Docker 本地启动容器并 curl 校验健康检查点与多语言页面（zh/en/vi）可达性。
# ==============================================================================

# 测试各平台构建适配与容器访问，不使用云账号，也不发布。
name: 测试 / 全平台部署适配（不发布）

# 触发条件配置：推送至 main、发起针对 main 的 PR，或手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 权限配置：赋予工作流读取仓库代码的权限
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 各主流云平台静态产物与路径适配构建测试（矩阵并发）
  # ----------------------------------------------------------------------------
  static:
    name: 静态产物 / ${{ matrix.target == 'oss' && '阿里云 OSS' || matrix.target == 'cos' && '腾讯云 COS' || matrix.target == 'pages' && 'GitHub Pages' || matrix.target == 'vercel' && 'Vercel' || 'Cloudflare Pages' }} / ${{ matrix.layout == 'root' && '根路径' || '子路径' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 某个平台组合测试失败时不终止其他组合的测试
      matrix:
        target: [pages, vercel, cloudflare, oss, cos] # 测试目标平台列表
        layout: [root, subpath] # 测试路径模式：根路径 / 独立子路径
        exclude:
          - target: vercel
            layout: subpath
          - target: cloudflare
            layout: subpath
    steps:
      # Step 1: 下载仓库代码到云端虚拟机
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1

      # Step 2: 检查核心配置文件与脚本完整性
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 运行环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 安装统一版本的 pnpm 包管理器
      - name: 安装 pnpm 11.27.1
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.27.1

      # Step 5: 依据锁文件安装依赖，禁用 Husky 钩子加速 CI
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # Step 6: 执行部署脚本的回归测试单元
      - name: 运行部署脚本回归测试
        run: pnpm test:deploy

      # Step 7: 根据当前矩阵组合（根路径 / 子路径）模拟编译打包前端项目
      - name: 构建测试网站
        run: pnpm build:deploy
        env:
          VITE_BASE: ${{ matrix.layout == 'subpath' && '/docs/' || '/' }}
          VITE_SITE_URL: ${{ matrix.layout == 'subpath' && 'https://example.com/docs' || 'https://example.com' }}

      # Step 8: 校验生成的静态页面、资源文件相对路径及站点地图（sitemap）是否正确
      - name: 检查页面、资源和站点地图
        run: node scripts/deploy/verify-output.js
        env:
          VITE_BASE: ${{ matrix.layout == 'subpath' && '/docs/' || '/' }}
          VITE_SITE_URL: ${{ matrix.layout == 'subpath' && 'https://example.com/docs' || 'https://example.com' }}

      # Step 9: 若目标为 Vercel，验证预构建产物生成逻辑（prepare-vercel.js）
      - name: 准备 Vercel 测试产物
        if: matrix.target == 'vercel'
        run: node scripts/deploy/prepare-vercel.js

      # Step 10: 记录测试摘要信息至 GitHub Actions Summary 界面
      - name: 记录测试范围
        run: echo '本任务仅验证构建和适配；未执行云端发布。' >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------
  # Job 2: Docker 容器镜像编译、本地运行与 HTTP 接口连通性自动化测试
  # ----------------------------------------------------------------------------
  docker:
    name: Docker 构建与 HTTP / ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [/, /docs/] # 测试不同容器 Base 路径下的运行情况
    steps:
      # Step 1: 下载仓库代码
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1

      # Step 2: 检查必要配置文件完整性
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 调用 docker/Dockerfile 构建本地测试镜像 docs-test
      - name: 构建测试镜像
        run: docker build -f docker/Dockerfile --build-arg VITE_BASE="$BASE" --build-arg VITE_SITE_URL="https://example.com${BASE}" -t docs-test .
        env:
          BASE: ${{ matrix.base }}

      # Step 5: 后台启动容器，使用轮询心跳机制检查 /healthz，并用 curl 验证多语言页面（zh/en/vi）与 404 处理是否正常
      - name: 启动容器并验证页面
        shell: bash
        env:
          BASE: ${{ matrix.base }}
        run: |
          docker run -d --name docs-test -p 8080:80 docs-test
          # docker run 返回不代表 Nginx 已就绪；连接重置也需等待重试。
          ready=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' docs-test)" != true ]; then
              echo "::error::测试容器已退出，请查看容器诊断日志。"
              exit 1
            fi
            if curl --silent --show-error --fail --connect-timeout 2 --max-time 3 http://127.0.0.1:8080/healthz; then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "::error::容器在等待期限内未就绪。"; exit 1; }
          # 就绪后严格检查页面；失败仍让任务报错，不掩盖服务问题。
          for page in zh/ en/ vi/; do
            curl --silent --show-error --fail --max-time 10 "http://127.0.0.1:8080${BASE}${page}" -o /dev/null
          done
          test "$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080${BASE}missing-page")" = 404

      # Step 6: 若任务运行失败，自动输出 Nginx 诊断日志及容器状态用于快速排错
      - name: 输出失败容器诊断
        if: failure()
        run: |
          docker ps -a --filter name=docs-test
          docker inspect docs-test || true
          docker logs --tail 100 docs-test || true
          docker exec docs-test nginx -t || true

      # Step 7: 无论成功或失败，最后清理停止并删除测试容器
      - name: 清理测试容器
        if: always()
        run: docker rm -f docs-test || true
