# GitHub Pages 入口；开启 PAGES_ENABLED 或手动运行后发布。
name: 网站部署入口 / GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js pages
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  pages:
    name: 调用 GitHub Pages 发布流程
    needs: selection
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    uses: ./.github/workflows/deploy-gh-pages.yml
    secrets: inherit
