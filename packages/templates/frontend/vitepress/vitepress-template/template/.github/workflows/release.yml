name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    # 自动部署需设置仓库变量；也可在 Actions 中手动运行。
    if: ${{ vars.PAGES_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/deploy-gh-pages.yml
    secrets: inherit
