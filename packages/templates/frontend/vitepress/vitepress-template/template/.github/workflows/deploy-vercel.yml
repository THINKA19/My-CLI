# ==============================================================================
# 📄 GitHub Actions CI/CD 工作流文件：自动部署网站至 Vercel 平台
# ------------------------------------------------------------------------------
# 💡 【新手学习指南 / 本文件作用与使用说明】
# 1. 这个文件是做什么的？
#    这是一个自动化部署（CD）配置文件。它的作用是在你把代码推送到 GitHub 后，
#    自动帮你在云端进行打包，并将最新的静态网站快速发布上线到 Vercel 云平台。
#
# 2. 它是怎么运行和使用的？
#    - 自动触发：向 main 分支推送代码（push）时，系统会自动启动部署流程。
#    - 手动触发：可在 GitHub 仓库的「Actions」界面找到此工作流，点击按钮手动触发部署。
#    - 前置依赖：需要在仓库的 Settings（环境变量与密钥配置）中配置 Vercel 的环境变量：
#      * Variables（变量）: VERCEL_ENABLED（开启开关）、VERCEL_SITE_URL（站点地址）
#      * Secrets（密钥）  : VERCEL_ORG_ID、VERCEL_PROJECT_ID、VERCEL_TOKEN
# ==============================================================================

# 发布 Vercel；自动发布需开启 VERCEL_ENABLED。
name: 网站部署 / Vercel

# 触发条件配置：推送代码到 main 分支或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限配置：赋予工作流读取仓库代码的权限
permissions:
  contents: read

# 并发控制：确保同一时间只有一个部署任务在运行，避免多次连续提交造成重复或冲突部署
concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 部署选择与状态校验（确定是否满足发布条件）
  # ----------------------------------------------------------------------------
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }} # 输出是否继续部署的标志
      matrix: ${{ steps.plan.outputs.matrix }} # 输出部署矩阵信息
    steps:
      # Step 1: 下载仓库代码到云端虚拟机
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1

      # Step 2: 校验项目基础文件与部署脚本是否存在且有效，避免中途报错
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 运行环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 执行决策脚本，检查环境变量（如 VERCEL_ENABLED）是否开启，决定是否触发发布
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js vercel
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}

  # ----------------------------------------------------------------------------
  # Job 2: 执行实际的构建与 Vercel 平台发布
  # ----------------------------------------------------------------------------
  deploy:
    name: 执行平台部署
    needs: selection # 依赖选人阶段：只有 Job 1 判定允许部署（outputs.selected == 'true'）时才执行
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    # 注入全局 Vercel 部署认证密钥
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Step 1: 完整拉取代码（fetch-depth: 0 表示获取完整 Git 提交历史，便于 Vercel 分析变更）
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Step 2: 二次校验部署必须文件
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 校验 Vercel 部署所需的配置与域名参数，确保 Token 及 ID 有效
      - name: 检查平台部署配置
        run: node scripts/deploy/check-config.js vercel
        env:
          VERCEL_SITE_URL: ${{ vars.VERCEL_SITE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Step 5: 安装统一版本的 pnpm 工具
      - name: 安装 pnpm 11.27.1
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.27.1

      # Step 6: 依据锁文件安装依赖，跳过 Husky 钩子加速 CI
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # Step 7: 编译构建前端静态资源（注入站点域名环境变量）
      - name: 构建静态网站
        run: pnpm run build:deploy
        env:
          VITE_BASE: /
          VITE_SITE_URL: ${{ vars.VERCEL_SITE_URL }}

      # Step 8: 将构建产物转换为 Vercel 要求的预构建（Build Output API）格式
      - name: 准备 Vercel 发布产物
        run: node scripts/deploy/prepare-vercel.js

      # Step 9: 调用 Vercel CLI 极速将预编译好的静态文件推送到生产环境上线
      - name: 发布网站
        run: pnpm dlx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
