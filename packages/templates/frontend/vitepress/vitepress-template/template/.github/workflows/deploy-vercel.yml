name: 网站部署 / Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-vercel
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve deployment selection
        id: plan
        run: node scripts/deploy/plan.js vercel
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  deploy:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        run: node scripts/deploy/check-config.js vercel
        env:
          VERCEL_SITE_URL: ${{ vars.VERCEL_SITE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Build static site
        run: pnpm run build:deploy
        env:
          VITE_BASE: /
          VITE_SITE_URL: ${{ vars.VERCEL_SITE_URL }}
      - name: Prepare prebuilt output
        run: node scripts/deploy/prepare-vercel.js
      - name: Deploy
        run: pnpm dlx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
