# 仅验证项目质量，不登录云平台，也不发布网站。
name: 检查 / 代码与构建
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: 代码规范、类型与构建检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
      # 锁文件必须随项目提交，CI 不会临时生成锁文件来绕过检查。
      - name: 检查依赖配置和测试文件
        shell: bash
        run: |
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.js tests/deploy/workflows.test.mjs; do
            test -s "$file" || { echo "::error file=$file::缺少或为空：$file，请提交完整项目。"; exit 1; }
          done
      # 先配置 Node，再安装统一版本的 pnpm，避免混用默认环境。
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装 pnpm 11.27.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: 检查代码规范
        run: pnpm run lint
      - name: 检查 TypeScript 类型
        run: pnpm run typecheck
      - name: 运行部署脚本回归测试
        run: pnpm run test:deploy
      - name: 验证网站生产构建
        run: pnpm run build
