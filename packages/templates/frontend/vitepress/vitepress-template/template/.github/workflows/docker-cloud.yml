# 只构建并推送已开启的镜像目标，可随后调用服务器部署。
name: 镜像发布 / 多仓库
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js docker
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  publish:
    name: 镜像推送 / ${{ matrix.target == 'aliyun' && '阿里云' || matrix.target == 'tencent' && '腾讯云' || 'Docker Hub' }}
    needs: selection
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查镜像仓库配置
        shell: bash
        env:
          REGISTRY: ${{ matrix.registry }}
          IMAGE: ${{ matrix.image }}
          SITE_URL: ${{ matrix.site_url }}
          REGISTRY_USER: ${{ secrets[matrix.username_secret] }}
          REGISTRY_PASSWORD: ${{ secrets[matrix.password_secret] }}
        run: |
          node scripts/deploy/check-config.js docker
          case "$IMAGE" in "$REGISTRY"/*) ;; *) echo "镜像名称必须包含匹配的仓库地址和命名空间"; exit 1 ;; esac
      - name: 准备 Docker 构建工具
        uses: docker/setup-buildx-action@v3
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username_secret] }}
          password: ${{ secrets[matrix.password_secret] }}
      - name: 生成镜像标签
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE=${{ matrix.base }}
            VITE_SITE_URL=${{ matrix.site_url }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
  deploy-server:
    name: 调用服务器部署流程
    needs: publish
    if: ${{ vars.SERVER_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
