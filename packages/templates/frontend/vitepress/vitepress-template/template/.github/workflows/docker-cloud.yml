# ==============================================================================
# 📄 GitHub Actions CI/CD 工作流文件：多仓库 Docker 镜像构建与推送
# ------------------------------------------------------------------------------
# 💡 【新手学习指南 / 本文件作用与使用说明】
# 1. 这个文件是做什么的？
#    这是一个容器镜像自动化发布（CD）配置文件。它的作用是在代码提交或打版本标签时，
#    自动在云端根据 Dockerfile 编译前端应用，并打包生成 Docker 镜像，
#    同步推送至阿里云、腾讯云或 Docker Hub 等指定的镜像仓库，甚至联动调用服务器进行部署。
#
# 2. 它是怎么运行和使用的？
#    - 自动触发：当推送代码到 main 分支、发布版本标签（如 v1.0.0）时自动运行。
#    - 手动触发：可在 GitHub 仓库的「Actions」界面找到此工作流，点击按钮手动运行。
#    - 矩阵并发：支持多平台并行构建，根据选中的目标仓库动态并行推送镜像。
# ==============================================================================

# 只构建并推送已开启的镜像目标，可随后调用服务器部署。
name: 镜像发布 / 多仓库

# 触发条件配置：推送至 main 分支、发布 v* 格式的 tag 标签，或手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 权限配置：仅赋予读取仓库内容的权限
permissions:
  contents: read

# 并发控制：同一分支/引用同一时间只运行一个镜像发布任务
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 部署选择与状态校验（确定推送的目标仓库矩阵）
  # ----------------------------------------------------------------------------
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }} # 输出是否继续执行构建的标志
      matrix: ${{ steps.plan.outputs.matrix }} # 输出选中的目标镜像仓库矩阵 JSON
    steps:
      # Step 1: 拉取项目代码到云端虚拟机
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1

      # Step 2: 检查核心配置文件与脚本是否齐全，避免缺少依赖脚本导致后期失败
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 运行环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 执行决策脚本，根据全局变量解析需要发布的 Docker 仓库列表矩阵
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js docker
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}

  # ----------------------------------------------------------------------------
  # Job 2: 构建 Docker 镜像并推送至目标镜像仓库（并行矩阵执行）
  # ----------------------------------------------------------------------------
  publish:
    name: 镜像推送 / ${{ matrix.target == 'aliyun' && '阿里云' || matrix.target == 'tencent' && '腾讯云' || 'Docker Hub' }}
    needs: selection # 依赖选择阶段：只有 selected 为 true 时才执行
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 单个矩阵目标失败时不终止其他仓库的构建推送
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }} # 动态解析可推损的目标仓库矩阵
    steps:
      # Step 1: 获取完整的项目提交历史，以便后续标记版本
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Step 2: 校验部署相关脚本完整性
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 运行环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 检查镜像仓库配置及 Secret 密钥是否完整，验证镜像名称前缀规范
      - name: 检查镜像仓库配置
        shell: bash
        env:
          REGISTRY: ${{ matrix.registry }}
          IMAGE: ${{ matrix.image }}
          SITE_URL: ${{ matrix.site_url }}
          REGISTRY_USER: ${{ secrets[matrix.username_secret] }}
          REGISTRY_PASSWORD: ${{ secrets[matrix.password_secret] }}
        run: |
          node scripts/deploy/check-config.js docker
          case "$IMAGE" in "$REGISTRY"/*) ;; *) echo "镜像名称必须包含匹配的仓库地址和命名空间"; exit 1 ;; esac

      # Step 5: 初始化与配置 Docker Buildx 高级构建工具
      - name: 准备 Docker 构建工具
        uses: docker/setup-buildx-action@v4.4.1

      # Step 6: 登录指定的远程镜像仓库（阿里云 / 腾讯云 / Docker Hub）
      - name: 登录镜像仓库
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username_secret] }}
          password: ${{ secrets[matrix.password_secret] }}

      # Step 7: 根据 Git Commit SHA、分支与 Tag 动态生成规范的 Docker 镜像标签
      - name: 生成镜像标签
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Step 8: 编译 Dockerfile 并将构建好的镜像推送到指定的远程仓库，同时利用 GHA 缓存加速构建
      - name: 构建并推送镜像
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE=${{ matrix.base }}
            VITE_SITE_URL=${{ matrix.site_url }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ----------------------------------------------------------------------------
  # Job 3: 联动触发下游服务器部署工作流（可选扩展步骤）
  # ----------------------------------------------------------------------------
  deploy-server:
    name: 调用服务器部署流程
    needs: publish # 依赖 publish 阶段：所有镜像成功推送后触发
    # 满足开启 SERVER_DEPLOY_ENABLED 变量且为 main 分支推送时，自动联动调用服务器部署工作流
    if: ${{ vars.SERVER_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
