name: Deploy OSS
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.vitepress/**'
      - 'scripts/**'
      - '.github/workflows/deploy-aliyun-oss.yml'
      - '.env.production'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-oss
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.OSS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      OSS_PREFIX: ${{ vars.OSS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Build
        shell: bash
        env:
          DEPLOY_SITE_URL: ${{ vars.OSS_SITE_URL }}
        run: |
          test -n "$DEPLOY_SITE_URL" || { echo "OSS_SITE_URL is required"; exit 1; }
          prefix="${OSS_PREFIX#/}"
          prefix="${prefix%/}"
          export VITE_BASE="/"
          if [ -n "$prefix" ]; then export VITE_BASE="/$prefix/"; fi
          export VITE_SITE_URL="$DEPLOY_SITE_URL"
          pnpm run build:deploy
      - name: Upload
        run: node scripts/deploy/oss.js
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
