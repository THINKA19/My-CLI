# 发布阿里云 OSS；上传目录与网站访问路径必须一致。
name: 网站部署 / 阿里云 OSS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-oss
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js oss
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  deploy:
    name: 执行平台部署
    needs: selection
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    env:
      OSS_PREFIX: ${{ vars.OSS_PREFIX }}
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 检查平台部署配置
        run: node scripts/deploy/check-config.js oss
        env:
          OSS_SITE_URL: ${{ vars.OSS_SITE_URL }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - name: 安装 pnpm 11.27.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: 构建网站部署产物
        shell: bash
        env:
          DEPLOY_SITE_URL: ${{ vars.OSS_SITE_URL }}
        run: |
          test -n "$DEPLOY_SITE_URL" || { echo "OSS_SITE_URL is required"; exit 1; }
          prefix="${OSS_PREFIX#/}"
          prefix="${prefix%/}"
          export VITE_BASE="/"
          if [ -n "$prefix" ]; then export VITE_BASE="/$prefix/"; fi
          export VITE_SITE_URL="$DEPLOY_SITE_URL"
          pnpm run build:deploy
      - name: 上传静态网站文件
        run: node scripts/deploy/oss.js
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
