name: 网站部署 / 阿里云 OSS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-oss
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve deployment selection
        id: plan
        run: node scripts/deploy/plan.js oss
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  deploy:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    env:
      OSS_PREFIX: ${{ vars.OSS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        run: node scripts/deploy/check-config.js oss
        env:
          OSS_SITE_URL: ${{ vars.OSS_SITE_URL }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Build
        shell: bash
        env:
          DEPLOY_SITE_URL: ${{ vars.OSS_SITE_URL }}
        run: |
          test -n "$DEPLOY_SITE_URL" || { echo "OSS_SITE_URL is required"; exit 1; }
          prefix="${OSS_PREFIX#/}"
          prefix="${prefix%/}"
          export VITE_BASE="/"
          if [ -n "$prefix" ]; then export VITE_BASE="/$prefix/"; fi
          export VITE_SITE_URL="$DEPLOY_SITE_URL"
          pnpm run build:deploy
      - name: Upload
        run: node scripts/deploy/oss.js
        env:
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
