# 通用服务器部署：阿里云、腾讯云及其他安装 Docker 的 Linux 服务器。
name: 服务器部署 / Docker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve deployment selection
        id: plan
        run: node scripts/deploy/plan.js server
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}
  deploy:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server configuration
        run: node scripts/deploy/check-config.js server
        env:
          SERVER_IMAGE: ${{ vars.SERVER_IMAGE }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
          SERVER_REGISTRY: ${{ vars.SERVER_REGISTRY }}
          SERVER_REGISTRY_USERNAME: ${{ secrets.SERVER_REGISTRY_USERNAME }}
          SERVER_REGISTRY_PASSWORD: ${{ secrets.SERVER_REGISTRY_PASSWORD }}
      - name: Deploy immutable image
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_IMAGE: ${{ vars.SERVER_IMAGE }}:${{ github.sha }}
          REGISTRY: ${{ vars.SERVER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.SERVER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SERVER_REGISTRY_PASSWORD }}
          CONTAINER: vitepress-docs
          HOST_PORT: ${{ vars.SERVER_PORT || '8080' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: DEPLOY_IMAGE,REGISTRY,REGISTRY_USER,REGISTRY_PASSWORD,CONTAINER,HOST_PORT
          script: |
            set -eu
            test -n "$REGISTRY" && test -n "$REGISTRY_USER" && test -n "$REGISTRY_PASSWORD"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            docker pull "$DEPLOY_IMAGE"
            wait_healthy() {
              for attempt in $(seq 1 30); do
                status=$(docker inspect --format '{{.State.Health.Status}}' "$1")
                [ "$status" = healthy ] && return 0
                sleep 2
              done
              return 1
            }
            docker rm -f "$CONTAINER-check" >/dev/null 2>&1 || true
            docker run -d --name "$CONTAINER-check" "$DEPLOY_IMAGE"
            status=failed
            if wait_healthy "$CONTAINER-check"; then status=healthy; fi
            docker rm -f "$CONTAINER-check"
            [ "$status" = healthy ] || { echo "New image failed health check"; exit 1; }
            docker rm -f "$CONTAINER-previous" >/dev/null 2>&1 || true
            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              docker stop "$CONTAINER"
              docker rename "$CONTAINER" "$CONTAINER-previous"
            fi
            if ! docker run -d --name "$CONTAINER" --restart unless-stopped -p "$HOST_PORT:80" "$DEPLOY_IMAGE" || ! wait_healthy "$CONTAINER"; then
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
              docker rename "$CONTAINER-previous" "$CONTAINER" && docker start "$CONTAINER" || true
              exit 1
            fi
