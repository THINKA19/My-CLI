# 缓存策略集中声明，各 location 继承同一组响应头。
map $uri $docs_cache_control {
    default "no-cache, must-revalidate";
    ~*/assets/ "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot|mp4|webm|ogg|mp3|wav|flac|aac)$ "public, max-age=3600";
}

server {
    # 浏览器访问 http://xxx 就是 80 端口
    listen 80;
    # 本机访问域名，后续部署到服务器上这里可以改成你的域名，比如 `docs.abc.com`
    server_name localhost;

    # 网站文件放在这个目录。对应你 Dockerfile 里复制 dist 的路径，VitePress 打包出来的静态文件全部丢这里
    root /usr/share/nginx/html;
    # 访问文件夹时，默认打开 index.html
    index index.html;

    # ==================== 1. 基础安全防护响应头 ====================
    # 隐藏 Nginx 具体版本号,防止暴露特定版本的安全漏洞
    server_tokens off;
    # 开启防 MIME 类型嗅探保护
    add_header X-Content-Type-Options "nosniff" always;
    # 防止网页被嵌套在其他站点的 iframe 中 (防点击劫持)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # XSS 防护
    add_header X-XSS-Protection "1; mode=block" always;
    # 严格传输安全(生产环境建议开启 HTTPS 后启用)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 推荐来源策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $docs_cache_control always;

    # 健康检查独立于部署目录，根路径和子路径镜像使用同一端点。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==================== 2. VitePress 路由与 HTML 处理 ====================
    location / {
        # 适配 cleanUrls：依次查找文件、对应 HTML 和目录，不存在时返回 404。
        try_files $uri $uri.html $uri/ =404;

        # HTML 和非指纹资源使用上方统一缓存策略。
    }

    # 自定义 404 页面兜底（可配合 VitePress 编译生成的 404.html）
    error_page 404 /404.html;

    # ==================== 3. 静态资源强缓存与智能缓存策略 ====================
    # 针对不同资源类型设置差异化缓存策略
    
    # 3.1 带 hash 的静态资源 - 1年强缓存(Vite 打包产物自动带 hash)
    location ~* \.(js|css)$ {
        access_log off;
        log_not_found off;
    }
    
    # 3.2 非指纹图片与字体资源 - 短缓存，便于原路径替换文件
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        access_log off;
        log_not_found off;
    }
    
    # 3.3 其他媒体文件 - 使用统一缓存策略
    location ~* \.(mp4|webm|ogg|mp3|wav|flac|aac)$ {
        access_log off;
    }

    # ==================== 4. 文本压缩优化 (Gzip) ====================
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    # 开启静态预压缩文件读取(若构建产物中已包含 .gz 文件,直接返回)
    gzip_static on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;
    
    # 禁止压缩已压缩的文件格式
    gzip_disable "msie6";
    
    # 优化缓冲区大小
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
}
