# ==============================================================================
# 📄 GitHub Actions CI/CD 工作流文件：自动部署静态网站至 Cloudflare Pages
# ------------------------------------------------------------------------------
# 💡 【新手学习指南 / 本文件作用与使用说明】
# 1. 这个文件是做什么的？
#    这是一个自动化部署（CD）配置文件。它的作用是在你将代码推送到 GitHub 后，
#    自动在云端编译前端项目，并调用 Wrangler CLI 将打包产物（dist 目录）极速发布上线到 Cloudflare Pages。
#
# 2. 它是怎么运行和使用的？
#    - 自动触发：推送代码到 main 分支时自动触发。
#    - 手动触发：可在 GitHub 仓库的「Actions」界面找到此工作流，点击按钮手动触发。
#    - 前置依赖：需在仓库 Settings（环境变量与密钥）中配置 Cloudflare 参数：
#      * Variables（变量）：CLOUDFLARE_ENABLED（开启开关）、CLOUDFLARE_SITE_URL、CLOUDFLARE_PROJECT_NAME
#      * Secrets（密钥）  ：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# ==============================================================================

# 发布 Cloudflare Pages；自动发布需开启 CLOUDFLARE_ENABLED。
name: 网站部署 / Cloudflare Pages

# 触发条件配置：推送代码到 main 分支或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限配置：赋予工作流读取仓库代码的权限
permissions:
  contents: read

# 并发控制：确保同一时间只有一个部署任务在运行，避免多次连续提交造成冲突
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: 部署选择与状态校验（确定是否满足发布条件）
  # ----------------------------------------------------------------------------
  selection:
    name: 部署选择与状态说明
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }} # 输出是否允许继续部署的标志
      matrix: ${{ steps.plan.outputs.matrix }} # 输出部署矩阵信息
    steps:
      # Step 1: 下载仓库代码到云端虚拟机
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1

      # Step 2: 校验项目基础文件与部署脚本是否存在且有效，避免中途报错
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 运行环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 执行决策脚本，检查环境变量（如 CLOUDFLARE_ENABLED）是否开启，决定是否触发发布
      - name: 判断部署目标并说明状态
        id: plan
        run: node scripts/deploy/plan.js cloudflare
        env:
          DEPLOY_VARS: ${{ toJSON(vars) }}
          DEPLOY_EVENT: ${{ github.event_name }}

  # ----------------------------------------------------------------------------
  # Job 2: 执行实际的构建与 Cloudflare Pages 平台发布
  # ----------------------------------------------------------------------------
  deploy:
    name: 执行平台部署
    needs: selection # 依赖选择阶段：只有 Job 1 判定允许部署（outputs.selected == 'true'）时才执行
    # 未选中平台时跳过实际发布，原因显示在选择任务的摘要中。
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    # 注入全局 Cloudflare 部署认证密钥与项目名
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      # Step 1: 完整拉取代码（fetch-depth: 0 表示获取完整 Git 提交历史，便于部署分析）
      - name: 检出项目代码
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Step 2: 二次校验部署必须文件
      # 在执行脚本前检查提交内容，避免文件遗漏变成不明原因的失败。
      - name: 检查项目文件是否齐全
        shell: bash
        run: |
          missing=0
          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/deploy/plan.js scripts/deploy/check-config.js scripts/deploy/build.js scripts/deploy/verify-output.js; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::缺少或为空：$file。请完整生成项目并提交此文件。"
              missing=1
            fi
          done
          exit "$missing"

      # Step 3: 配置 Node.js 24 环境
      - name: 配置 Node.js 24 环境
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Step 4: 检查平台部署参数，验证 API Token、Account ID 及项目名称是否已正确配置
      - name: 检查平台部署配置
        run: node scripts/deploy/check-config.js cloudflare
        env:
          CLOUDFLARE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}

      # Step 5: 安装统一版本的 pnpm 工具
      - name: 安装 pnpm 11.27.1
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.27.1

      # Step 6: 依据锁文件安装依赖，禁用 Husky 钩子加速 CI
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # Step 7: 编译打包前端静态资源（注入站点域名环境变量，输出至 dist 目录）
      - name: 构建网站部署产物
        run: pnpm run build:deploy
        env:
          VITE_BASE: /
          VITE_SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}

      # Step 8: 校验项目名称非空，并调用 Wrangler CLI 将 dist 产物直接部署至 Cloudflare Pages 的 main 分支
      - name: 发布网站
        run: |
          test -n "$PROJECT_NAME"
          pnpm dlx wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main
