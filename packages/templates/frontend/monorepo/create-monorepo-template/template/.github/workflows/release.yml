name: Release

# 推送形如 v1.0.0 的 Tag 时触发
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备环境
        uses: ./.github/actions/setup

      - name: 构建
        run: pnpm build

      # 使用 GitHub 自带的 GITHUB_TOKEN，无需额外配置密钥
      # --generate-notes 会根据提交记录自动生成发布说明
      - name: 创建 GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}