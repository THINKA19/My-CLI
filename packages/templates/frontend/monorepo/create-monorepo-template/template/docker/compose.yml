# 不要写 version 字段，新版 Compose 已废弃
services:
  frontend:
    build:
      # 相对于本文件所在目录：.. 就是仓库根目录
      context: ..
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    # 读取根目录的 .env，文件不存在也不报错
    env_file:
      - path: ../.env
        required: false